<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PromptMastery, an AI course (preview build)</title>
<meta name="description" content="The Real-World AI &amp; Prompt Engineering Course, personalised for whoever opens it." />
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@300;400;500;600;700&family=Great+Vibes&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          serif: ['"Playfair Display"', 'serif'],
          sans: ['Inter', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
          script: ['"Great Vibes"', 'cursive']
        },
        colors: {
          brand: { 50:'#eef2ff', 100:'#e0e7ff', 200:'#c7d2fe', 300:'#a5b4fc', 400:'#818cf8', 500:'#6366f1', 600:'#4f46e5', 700:'#4338ca', 800:'#3730a3', 900:'#312e81' },
          gold:  { 50:'#fdf8ef', 100:'#faecd4', 200:'#f3d59f', 300:'#e8b96a', 400:'#d4a574', 500:'#c08a4a', 600:'#9b6a33', 700:'#73502a', 800:'#503923', 900:'#332518' },
          cream: '#FAF7F2',
          navy:  '#0F172A',
        },
        boxShadow: {
          soft: '0 10px 30px -10px rgba(79,70,229,0.18)',
          card: '0 4px 20px -6px rgba(15,23,42,0.10)',
          glow: '0 0 0 4px rgba(129,140,248,0.25)'
        }
      }
    }
  }
</script>
<style>
  html, body { background: #FAF7F2; }
  .dark html, .dark body { background: #0F172A; }
  body { font-family: 'Inter', sans-serif; color: #1f2937; }
  .dark body { color: #e5e7eb; }
  h1,h2,h3,h4,.font-serif { font-family: 'Playfair Display', serif; letter-spacing: -0.01em; }
  .hero-gradient {
    background:
      radial-gradient(1200px 400px at 80% -10%, rgba(212,165,116,0.25), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(129,140,248,0.35), transparent 60%),
      linear-gradient(135deg, #4F46E5 0%, #6D28D9 55%, #4F46E5 100%);
  }
  .prompt-box {
    background: #1f2937; color: #f9fafb; border-radius: 12px; padding: 14px 16px;
    font-family: 'JetBrains Mono', monospace; font-size: 13.5px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
  }
  .dark .prompt-box { background: #0b1220; border: 1px solid #1f2937; }
  .callout { border-left: 4px solid; border-radius: 12px; padding: 14px 16px; }
  .callout.tip   { border-color: #4F46E5; background: #eef2ff; }
  .callout.warn  { border-color: #f59e0b; background: #fffbeb; }
  .callout.ex    { border-color: #10b981; background: #ecfdf5; }
  .callout.note  { border-color: #d4a574; background: #fdf8ef; }
  .callout.bad   { border-color: #ef4444; background: #fef2f2; }
  .dark .callout.tip   { background: rgba(79,70,229,0.12); }
  .dark .callout.warn  { background: rgba(245,158,11,0.10); }
  .dark .callout.ex    { background: rgba(16,185,129,0.10); }
  .dark .callout.note  { background: rgba(212,165,116,0.10); }
  .dark .callout.bad   { background: rgba(239,68,68,0.10); }
  .session-link.active { background: linear-gradient(90deg, rgba(79,70,229,0.10), transparent); color: #4F46E5; }
  .dark .session-link.active { color: #a5b4fc; background: linear-gradient(90deg, rgba(165,180,252,0.12), transparent); }
  .fade-in { animation: fade 400ms ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .pop { animation: pop 350ms ease-out; }
  @keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .ring-bg { stroke: #e5e7eb; }
  .dark .ring-bg { stroke: #1f2937; }

  /* Certificate */
  .cert-wrap { aspect-ratio: 1.414 / 1; width: 100%; max-width: 1100px; margin: auto;
    background: linear-gradient(135deg, #fffdf7 0%, #fdf6e3 100%);
    color: #2b2410; position: relative; overflow: hidden;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,0.35);
    border: 2px solid #d4a574;
  }
  .cert-inner { position: absolute; inset: 22px; border: 1px solid #d4a574; padding: 36px 48px; }
  .cert-inner::before, .cert-inner::after {
    content:''; position:absolute; width:120px; height:120px; pointer-events:none;
    background-image: radial-gradient(circle at center, transparent 50%, #d4a574 51%, transparent 53%);
  }
  .seal {
    width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #f3d59f, #c08a4a 80%);
    box-shadow: inset 0 0 0 6px #fff8e6, 0 6px 18px rgba(0,0,0,0.25);
    display: flex; align-items:center; justify-content:center;
    color: #5b3a14; font-family: 'Playfair Display', serif; font-weight: 800;
    position: relative;
  }
  .ribbon {
    position: absolute; top: 88px; left: 50%; transform: translateX(-50%);
    width: 28px; height: 60px; background: #b91c1c; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
  }
  .confetti-piece { position: fixed; width: 8px; height: 14px; opacity: 0.9; z-index: 70; pointer-events:none; }

  /* Sidebar scroll */
  .nice-scroll::-webkit-scrollbar { width: 8px; }
  .nice-scroll::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 8px; }
  .dark .nice-scroll::-webkit-scrollbar-thumb { background: #312e81; }

  /* Drag/match cards */
  .tool-card { transition: all .2s ease; cursor: pointer; }
  .tool-card.selected { outline: 3px solid #4F46E5; transform: translateY(-2px); }
  .scenario.matched { opacity: .55; }

  /* Print certificate */
  @media print {
    body * { visibility: hidden; }
    #certificate-print, #certificate-print * { visibility: visible; }
    #certificate-print { position: absolute; inset: 0; }
  }
</style>
</head>
<body class="min-h-screen">

<!-- App Shell -->
<div id="app"></div>

<!-- Settings Modal -->
<div id="settings-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 backdrop-blur-sm">
  <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-[min(520px,92vw)] p-6">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-xl font-serif font-bold">Settings</h3>
      <button onclick="closeSettings()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <label class="block text-sm font-medium mb-1">Your Name</label>
    <input id="settings-name" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 mb-4" />
    <div class="flex items-center justify-between mb-4">
      <span class="text-sm font-medium">Dark Mode</span>
      <button id="settings-dark" onclick="toggleDark()" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm"></button>
    </div>
    <div class="grid grid-cols-2 gap-2 mb-4">
      <button onclick="exportProgress()" class="px-3 py-2 rounded-lg bg-brand-600 text-white text-sm hover:bg-brand-700">Export Progress</button>
      <button onclick="demoUnlock()" class="px-3 py-2 rounded-lg bg-gold-400 text-white text-sm hover:bg-gold-500">Demo Unlock 🎓</button>
    </div>
    <button onclick="resetProgress()" class="w-full px-3 py-2 rounded-lg border border-red-400 text-red-600 text-sm hover:bg-red-50 dark:hover:bg-red-950">Reset All Progress</button>
    <div class="flex justify-end mt-5">
      <button onclick="saveSettings()" class="px-4 py-2 rounded-lg bg-brand-600 text-white text-sm hover:bg-brand-700">Save</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden">
  <div class="bg-slate-900 text-white text-sm px-4 py-2 rounded-full shadow-2xl flex items-center gap-2">
    <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
    <span id="toast-text"></span>
  </div>
</div>

<script>
/* =========================================================
   PromptMastery — Interactive AI Course
   Personalised for the visitor (name from #name= or this browser)
   Single-file vanilla JS SPA, persisted in localStorage
   ========================================================= */

/* ---------------- STATE ---------------- */
const VISITOR_NAME = (() => {
  const clean = (v) => (v || "").replace(/[^\p{L}\p{M} .-]/gu, "").replace(/\s+/g, " ").trim().slice(0, 30);
  try {
    const fromLink = clean(new URLSearchParams(location.hash.slice(1)).get("name"));
    if (fromLink) { localStorage.setItem("bfb_visitor_name", fromLink); return fromLink; }
    return clean(localStorage.getItem("bfb_visitor_name"));
  } catch (e) { return ""; }
})();
const LS_KEY = 'bfb_promptmastery_preview_v1';
const defaultState = {
  name: VISITOR_NAME || 'Friend',
  dark: false,
  progress: {}, // {sessionId: {done:bool, quizScore:number, exercisesDone:[ids]}}
  journal: [],  // {id, title, body, ts}
  finalProject: null,
  lastRoute: '#/welcome',
  certUnlocked: false,
  certId: 'PM-' + Math.random().toString(36).slice(2,8).toUpperCase()
};
let state = loadState();
if (VISITOR_NAME) state.name = VISITOR_NAME;
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return {...defaultState};
    return {...defaultState, ...JSON.parse(raw)};
  } catch(e) { return {...defaultState}; }
}
function saveState() {
  localStorage.setItem(LS_KEY, JSON.stringify(state));
}
function firstName() { return (state.name || 'Friend').split(' ')[0]; }

/* ---------------- AI TOOLS ---------------- */
const TOOLS = [
  { id:'chatgpt', name:'ChatGPT', url:'https://chat.openai.com', emoji:'💬', tag:'Text', desc:'The versatile all-rounder. Great for writing, coding, brainstorming, and casual chat.' },
  { id:'claude',  name:'Claude', url:'https://claude.ai', emoji:'📝', tag:'Text', desc:'Thoughtful and nuanced. Best for long documents, careful analysis, and writing with style.' },
  { id:'gemini',  name:'Google Gemini', url:'https://gemini.google.com', emoji:'✨', tag:'Text', desc:'Plugs into Google apps. Strong for research, multimodal tasks, and live web info.' },
  { id:'copilot', name:'Microsoft Copilot', url:'https://copilot.microsoft.com', emoji:'🪟', tag:'Text', desc:'Lives inside Word, Excel, PowerPoint, and Windows. Perfect for Office workflows.' },
  { id:'perplexity', name:'Perplexity', url:'https://www.perplexity.ai', emoji:'🔎', tag:'Research', desc:'Like Google + ChatGPT. Always cites its sources — your research best friend.' },
  { id:'midjourney', name:'Midjourney', url:'https://www.midjourney.com', emoji:'🎨', tag:'Image', desc:'Artistic, dreamy, beautiful images. The art-school of AI image tools.' },
  { id:'dalle', name:'DALL·E (inside ChatGPT)', url:'https://chat.openai.com', emoji:'🖼️', tag:'Image', desc:'Quick images with readable text right inside ChatGPT.' },
  { id:'leonardo', name:'Leonardo AI', url:'https://leonardo.ai', emoji:'🦁', tag:'Image', desc:'Free tier, game-art and concept art focus. Generous daily credits.' },
  { id:'sora', name:'Sora', url:'https://sora.com', emoji:'🎬', tag:'Video', desc:'OpenAI\'s text-to-video. Cinematic short clips from words.' },
  { id:'runway', name:'Runway', url:'https://runway.ml', emoji:'🎞️', tag:'Video', desc:'Pro-grade AI video editing, image-to-video, and motion magic.' },
  { id:'eleven', name:'ElevenLabs', url:'https://elevenlabs.io', emoji:'🎙️', tag:'Audio', desc:'Hyper-realistic AI voices. Read scripts, dub videos, clone your own voice.' },
  { id:'suno', name:'Suno', url:'https://suno.com', emoji:'🎵', tag:'Audio', desc:'AI music with lyrics, vocals, instruments. Type a vibe, get a song.' },
  { id:'notebooklm', name:'NotebookLM', url:'https://notebooklm.google.com', emoji:'📚', tag:'Study', desc:'Upload PDFs and have a tutor that only answers from YOUR documents.' },
];

/* ---------------- SESSIONS DATA ---------------- */
const SESSIONS = [
  {
    id:1, title:'What is AI & Prompt Engineering?', icon:'sparkles', time:'25 min', level:'Beginner',
    objectives:['Understand what a Large Language Model really is','Learn why prompts matter','Master the 4 pillars of every good prompt','Rewrite a vague prompt into a clear one'],
    render: renderSession1
  },
  {
    id:2, title:'Meet Your AI Toolbox', icon:'toolbox', time:'30 min', level:'Beginner',
    objectives:['Discover 13 essential AI tools','Know which tool to use when','Sign up and try 3 of them'],
    render: renderSession2
  },
  {
    id:3, title:'The Anatomy of a Perfect Prompt (CO-STAR)', icon:'layout-template', time:'35 min', level:'Beginner',
    objectives:['Learn the CO-STAR framework','Try RTF, RISEN & CRISPE briefly','Build prompts with the live CO-STAR Builder'],
    render: renderSession3
  },
  {
    id:4, title:'Prompting Techniques That Actually Work', icon:'wand-2', time:'35 min', level:'Intermediate',
    objectives:['Zero-shot vs Few-shot prompting','Chain-of-thought reasoning','Role and persona prompting'],
    render: renderSession4
  },
  {
    id:5, title:'Writing & Communication with AI', icon:'pen-line', time:'30 min', level:'Beginner',
    objectives:['Write in your own voice','Emails, essays, posts, summaries','10 copy-paste-ready templates'],
    render: renderSession5
  },
  {
    id:6, title:'Learning & Research with AI', icon:'graduation-cap', time:'30 min', level:'Beginner',
    objectives:['Use AI as a personal tutor','Research safely with Perplexity & NotebookLM','Spot and avoid hallucinations'],
    render: renderSession6
  },
  {
    id:7, title:'Prompting for Images', icon:'image', time:'35 min', level:'Intermediate',
    objectives:['The image prompt formula','Style, lighting, composition keywords','Build prompts with the Image Builder'],
    render: renderSession7
  },
  {
    id:8, title:'Prompting for Video & Audio', icon:'film', time:'30 min', level:'Intermediate',
    objectives:['Sora & Runway video basics','ElevenLabs voice prompting','Suno music prompting'],
    render: renderSession8
  },
  {
    id:9, title:'Data, Analysis & Productivity', icon:'bar-chart-3', time:'30 min', level:'Intermediate',
    objectives:['Analyze CSV/Excel with AI','Build formulas without coding','Summarize meetings & docs'],
    render: renderSession9
  },
  {
    id:10, title:'Ethics & Becoming an AI Power User', icon:'shield-check', time:'25 min', level:'All',
    objectives:['Iterative & chained prompting','Privacy and safety','Build your personal prompt vault'],
    render: renderSession10
  }
];

/* ---------------- ROUTER ---------------- */
function router() {
  const hash = location.hash || '#/welcome';
  state.lastRoute = hash; saveState();
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (hash === '#/welcome') return renderWelcome(app);
  if (hash.startsWith('#/session/')) {
    const id = parseInt(hash.split('/')[2]);
    return renderSessionShell(app, id);
  }
  if (hash === '#/journal') return renderShell(app, 'Prompt Journal', renderJournal);
  if (hash === '#/final') return renderShell(app, 'Final Project', renderFinal);
  if (hash === '#/certificate') return renderShell(app, 'Certificate', renderCertificate);
  if (hash === '#/search') return renderShell(app, 'Search', renderSearch);
  if (hash === '#/tools') return renderShell(app, 'AI Toolbox', renderTools);
  location.hash = '#/welcome';
}
window.addEventListener('hashchange', router);

/* ---------------- LAYOUT ---------------- */
function progressPct() {
  const total = SESSIONS.length + 1; // sessions + final
  let done = 0;
  SESSIONS.forEach(s => { if (state.progress[s.id]?.done) done++; });
  if (state.finalProject) done++;
  return Math.round((done/total)*100);
}
function progressRing(size=72, stroke=8) {
  const r = (size - stroke)/2;
  const c = 2*Math.PI*r;
  const pct = progressPct();
  const off = c - (pct/100)*c;
  return `
    <div class="relative" style="width:${size}px;height:${size}px;">
      <svg width="${size}" height="${size}" class="-rotate-90">
        <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" fill="none"/>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="url(#g1)" stroke-width="${stroke}" fill="none"
          stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .6s ease"/>
        <defs><linearGradient id="g1" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#4F46E5"/><stop offset="100%" stop-color="#D4A574"/></linearGradient></defs>
      </svg>
      <div class="absolute inset-0 flex items-center justify-center text-xs font-bold">${pct}%</div>
    </div>`;
}

function sidebar(activeId) {
  const items = SESSIONS.map(s => {
    const done = state.progress[s.id]?.done;
    const active = activeId === s.id;
    return `<a href="#/session/${s.id}" class="session-link ${active?'active':''} flex items-center gap-3 px-3 py-2 rounded-xl text-sm hover:bg-brand-50 dark:hover:bg-slate-800">
      <span class="w-6 h-6 rounded-full ${done?'bg-emerald-500 text-white':'bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300'} text-[11px] font-bold flex items-center justify-center">${done?'✓':s.id}</span>
      <span class="truncate">${s.title}</span>
    </a>`;
  }).join('');
  return `
    <aside class="w-72 shrink-0 hidden lg:flex flex-col gap-3 p-4 bg-white/70 dark:bg-slate-900/60 backdrop-blur border-r border-slate-200 dark:border-slate-800 min-h-screen">
      <a href="#/welcome" class="flex items-center gap-2 px-2 py-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-600 to-gold-400 flex items-center justify-center text-white font-bold">P</div>
        <div>
          <div class="font-serif font-bold leading-none">PromptMastery</div>
          <div class="text-[11px] text-slate-500">Your AI course</div>
        </div>
      </a>
      <div class="flex items-center gap-3 p-3 rounded-2xl bg-gradient-to-br from-brand-50 to-gold-50 dark:from-slate-800 dark:to-slate-800">
        ${progressRing(56,6)}
        <div>
          <div class="text-xs text-slate-500">Welcome,</div>
          <div class="font-bold text-sm leading-tight">${firstName()} 👋</div>
          <div class="text-[11px] text-slate-500 mt-0.5">${progressPct()}% complete</div>
        </div>
      </div>
      <nav class="flex flex-col gap-1 mt-2 overflow-auto nice-scroll" style="max-height: calc(100vh - 280px)">
        <div class="text-[11px] uppercase tracking-wider text-slate-400 px-3 mt-1 mb-1">Sessions</div>
        ${items}
        <div class="text-[11px] uppercase tracking-wider text-slate-400 px-3 mt-3 mb-1">More</div>
        <a href="#/tools" class="flex items-center gap-3 px-3 py-2 rounded-xl text-sm hover:bg-brand-50 dark:hover:bg-slate-800"><i data-lucide="layout-grid" class="w-4 h-4"></i>AI Toolbox</a>
        <a href="#/journal" class="flex items-center gap-3 px-3 py-2 rounded-xl text-sm hover:bg-brand-50 dark:hover:bg-slate-800"><i data-lucide="book-open" class="w-4 h-4"></i>Prompt Journal</a>
        <a href="#/search" class="flex items-center gap-3 px-3 py-2 rounded-xl text-sm hover:bg-brand-50 dark:hover:bg-slate-800"><i data-lucide="search" class="w-4 h-4"></i>Search</a>
        <a href="#/final" class="flex items-center gap-3 px-3 py-2 rounded-xl text-sm hover:bg-brand-50 dark:hover:bg-slate-800"><i data-lucide="flag" class="w-4 h-4"></i>Final Project</a>
        <a href="#/certificate" class="flex items-center gap-3 px-3 py-2 rounded-xl text-sm hover:bg-brand-50 dark:hover:bg-slate-800"><i data-lucide="award" class="w-4 h-4"></i>Certificate</a>
      </nav>
      <div class="mt-auto flex items-center gap-2">
        <button onclick="openSettings()" class="flex-1 flex items-center justify-center gap-2 text-xs px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200"><i data-lucide="settings" class="w-3.5 h-3.5"></i>Settings</button>
        <button onclick="toggleDark()" class="px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs"><i data-lucide="moon" class="w-3.5 h-3.5"></i></button>
      </div>
    </aside>`;
}
function mobileBar() {
  return `<div class="lg:hidden flex items-center justify-between p-3 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur sticky top-0 z-30">
    <a href="#/welcome" class="flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-600 to-gold-400 text-white text-sm font-bold flex items-center justify-center">P</div><span class="font-serif font-bold">PromptMastery</span></a>
    <div class="flex items-center gap-2">
      ${progressRing(36,5)}
      <button onclick="openMobileMenu()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800"><i data-lucide="menu" class="w-5 h-5"></i></button>
    </div>
  </div>`;
}

function openMobileMenu() {
  // Build a quick overlay
  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-40 bg-black/40 lg:hidden';
  overlay.onclick = () => overlay.remove();
  const panel = document.createElement('div');
  panel.className = 'absolute left-0 top-0 bottom-0 w-72 bg-white dark:bg-slate-900 p-4 overflow-auto';
  panel.innerHTML = sidebar(-1).replace('hidden lg:flex','flex');
  panel.onclick = (e)=>{ if (e.target.tagName === 'A') overlay.remove(); e.stopPropagation(); };
  overlay.appendChild(panel);
  document.body.appendChild(overlay);
  lucide.createIcons();
}

function renderShell(app, title, contentFn) {
  app.innerHTML = `
    ${mobileBar()}
    <div class="flex">
      ${sidebar(-1)}
      <main class="flex-1 min-w-0">
        <div class="max-w-5xl mx-auto px-5 lg:px-10 py-8 fade-in">
          <h1 class="text-3xl lg:text-4xl font-serif font-bold mb-6">${title}</h1>
          <div id="shell-content"></div>
        </div>
      </main>
    </div>`;
  contentFn(document.getElementById('shell-content'));
  lucide.createIcons();
}

/* ---------------- WELCOME ---------------- */
function renderWelcome(app) {
  const resumeRoute = state.lastRoute && state.lastRoute !== '#/welcome' ? state.lastRoute : '#/session/1';

function copyPrompt(uid) {
  const v = document.getElementById(uid).value;
  navigator.clipboard.writeText(v).then(()=> toast('Copied! Paste it into your AI tool.'));
}
function savePrompt(uid, exId) {
  const v = document.getElementById(uid).value.trim();
  if (!v) { toast('Write a prompt first ✍️'); return; }
  state.journal.unshift({ id:'j'+Date.now(), title:exId || ('Prompt ' + new Date().toLocaleDateString()), body:v, ts:Date.now() });
  saveState();
  toast('Saved to your Prompt Journal 📔');
}
function tryOn(uid, toolId) {
  const v = document.getElementById(uid).value;
  if (v.trim()) navigator.clipboard.writeText(v).catch(()=>{});
  const urls = {
    chatgpt: 'https://chat.openai.com/?q=' + encodeURIComponent(v),
    claude: 'https://claude.ai/new?q=' + encodeURIComponent(v),
    gemini: 'https://gemini.google.com/app',
    perplexity: 'https://www.perplexity.ai/?q=' + encodeURIComponent(v)
  };
  toast('Opening ' + toolId + ' — your prompt is also copied to clipboard.');
  window.open(urls[toolId], '_blank');
}

/* ---------------- WIDGET: Quiz ---------------- */
function quiz(sessionId, questions) {
  const qid = 'q-'+sessionId;
  setTimeout(()=> {
    const root = document.getElementById(qid);
    if (!root) return;
    let answers = new Array(questions.length).fill(null);
    function paint() {
      root.innerHTML = `
        <div class="rounded-2xl border border-brand-200 dark:border-slate-700 p-5 bg-brand-50/50 dark:bg-slate-900">
          <div class="flex items-center justify-between mb-4">
            <div class="font-serif text-xl font-bold flex items-center gap-2"><i data-lucide="clipboard-list" class="w-5 h-5 text-brand-600"></i>End-of-Session Quiz</div>
            <div class="text-xs text-slate-500">${questions.length} questions</div>
          </div>
          ${questions.map((q,i)=>`
            <div class="mb-5">
              <div class="font-medium mb-2">${i+1}. ${q.q}</div>
              <div class="grid gap-2">
                ${q.opts.map((o,j)=>{
                  const sel = answers[i]===j;
                  const correct = answers[i]!==null && j===q.a;
                  const wrong = sel && j!==q.a;
                  const cls = answers[i]===null
                    ? 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:border-brand-400'
                    : correct ? 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-400'
                    : wrong   ? 'bg-red-50 dark:bg-red-950/40 border-red-400'
                    : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 opacity-70';
                  return `<button ${answers[i]!==null?'disabled':''} onclick="window.__qpick_${qid}(${i},${j})" class="text-left text-sm px-3 py-2 rounded-lg border ${cls}">${o}${answers[i]!==null && j===q.a?' ✅':''}${wrong?' ❌':''}</button>`;
                }).join('')}
              </div>
              ${answers[i]!==null ? `<div class="mt-2 text-xs text-slate-500 italic">${q.exp||''}</div>`:''}
            </div>
          `).join('')}
          ${answers.every(a=>a!==null) ? (()=>{
            const score = answers.reduce((s,a,i)=> s + (a===questions[i].a?1:0), 0);
            state.progress[sessionId] = state.progress[sessionId] || {};
            state.progress[sessionId].quizScore = score;
            saveState();
            const pct = Math.round(score/questions.length*100);
            const msg = pct===100 ? `Perfect, ${firstName()}! 🌟` : pct>=70 ? `Great work, ${firstName()}! 💪` : `Good try, ${firstName()} — review and retry anytime.`;
            return `<div class="mt-2 p-3 rounded-xl bg-gradient-to-r from-brand-100 to-gold-100 dark:from-slate-800 dark:to-slate-800 text-sm font-medium">Score: ${score}/${questions.length} (${pct}%) — ${msg}</div>`;
          })() : ''}
        </div>`;
      window['__qpick_'+qid] = (i,j) => { answers[i]=j; paint(); lucide.createIcons(); };
      lucide.createIcons();
    }
    paint();
  }, 50);
  return `<div id="${qid}" class="mt-8"></div>`;
}

function initToolMatch() {
  const scenarios = [
    { id:'s1', text:'Write a polite resignation letter', correct:'chatgpt' },
    { id:'s2', text:'Generate a fantasy book cover image', correct:'midjourney' },
    { id:'s3', text:'Research climate policy with sources', correct:'perplexity' },
    { id:'s4', text:'Create a 30-second podcast intro voiceover', correct:'eleven' },
    { id:'s5', text:'Make a 5-second cinematic video of a city at night', correct:'sora' },
  ];
  const tools = ['chatgpt','midjourney','perplexity','eleven','sora'].map(id=>TOOLS.find(t=>t.id===id));
  const root = document.getElementById('toolmatch');
  let selectedScenario = null;
  let matches = {};
  function paint() {
    const done = Object.keys(matches).length === scenarios.length;
    const correct = scenarios.filter(s=>matches[s.id]===s.correct).length;
    root.innerHTML = `
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Scenarios</div>
          ${scenarios.map(s=>{
            const m = matches[s.id];
            const ok = m && m===s.correct;
            const bad = m && m!==s.correct;
            return `<button onclick="window.__pickScenario('${s.id}')" class="scenario w-full text-left p-3 mb-2 rounded-xl border ${selectedScenario===s.id?'border-brand-500 ring-2 ring-brand-200':'border-slate-200 dark:border-slate-700'} ${m?'matched':''} bg-white dark:bg-slate-900">
              <div class="text-sm font-medium">${s.text}</div>
              ${m?`<div class="text-xs mt-1 ${ok?'text-emerald-600':'text-red-600'}">${ok?'✅ Matched: '+TOOLS.find(t=>t.id===m).name:'❌ Try again: '+TOOLS.find(t=>t.id===m).name}</div>`:''}
            </button>`;
          }).join('')}
        </div>
        <div>
          <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Tools</div>
          ${tools.map(t=>`<button onclick="window.__pickTool('${t.id}')" class="tool-card w-full text-left p-3 mb-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900">
            <div class="font-medium text-sm">${t.emoji} ${t.name}</div>
            <div class="text-xs text-slate-500">${t.desc}</div>
          </button>`).join('')}
        </div>
      </div>
      ${done?`<div class="mt-4 p-3 rounded-xl ${correct===scenarios.length?'bg-emerald-50 text-emerald-700':'bg-amber-50 text-amber-700'} text-sm font-medium">You matched ${correct} of ${scenarios.length}. ${correct===scenarios.length?'Perfect, '+firstName()+'! 🌟':'Click any scenario to re-pick.'}</div>`:''}
    `;
  }
  window.__pickScenario = (id)=>{ selectedScenario = id; paint(); };
  window.__pickTool = (tid)=>{ if (!selectedScenario) { toast('Pick a scenario first.'); return; } matches[selectedScenario]=tid; selectedScenario=null; paint(); };
  paint();
}

function updateCostar() {
  const ids = ['cs-context','cs-objective','cs-style','cs-tone','cs-audience','cs-response'];
  const labels = ['CONTEXT','OBJECTIVE','STYLE','TONE','AUDIENCE','RESPONSE'];
  const lines = ids.map((id,i)=>{
    const v = (document.getElementById(id)?.value||'').trim();
    return v ? `${labels[i]}: ${v}` : null;
  }).filter(Boolean);
  const out = document.getElementById('cs-output');
  if (out) out.textContent = lines.length ? lines.join('\n') : `Fill in any field above — your prompt appears here in real time, ${firstName()}.`;
}
function copyEl(id){ navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>toast('Copied!'));}
function saveAssembled(id, title){ const b=document.getElementById(id).textContent; if(!b||b.startsWith('Fill in')){toast('Build a prompt first.');return;} state.journal.unshift({id:'j'+Date.now(),title,body:b,ts:Date.now()}); saveState(); toast('Saved to Journal 📔'); }
function openWithText(tool,id){ const t=document.getElementById(id).textContent; navigator.clipboard.writeText(t); const urls={chatgpt:'https://chat.openai.com/?q='+encodeURIComponent(t),claude:'https://claude.ai/new?q='+encodeURIComponent(t),gemini:'https://gemini.google.com/app'}; toast('Opened — prompt also copied.'); window.open(urls[tool],'_blank'); }

          <textarea class="w-full font-mono text-sm bg-slate-50 dark:bg-slate-800 rounded-lg p-2 min-h-[120px]" oninput="updateJournalBody('${j.id}', this.value)">${escapeHtml(j.body)}</textarea>
          <div class="flex justify-between items-center mt-2 text-xs text-slate-500">
            <span>${new Date(j.ts).toLocaleString()}</span>
            <div class="flex gap-1">
              <button onclick="navigator.clipboard.writeText(${JSON.stringify(j.body)});toast('Copied!')" class="px-2 py-1 rounded hover:bg-slate-100 dark:hover:bg-slate-800"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>
              <button onclick="deleteJournal('${j.id}')" class="px-2 py-1 rounded hover:bg-red-50 text-red-600"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
            </div>
          </div>
        </div>`).join('')}</div>`}
    `;
    lucide.createIcons();
  }
  window.updateJournalTitle = (id,v)=>{ const j=state.journal.find(x=>x.id===id); if(j){j.title=v; saveState();}};
  window.updateJournalBody  = (id,v)=>{ const j=state.journal.find(x=>x.id===id); if(j){j.body=v; saveState();}};
  window.deleteJournal = (id)=>{ if(confirm('Delete this prompt?')){ state.journal = state.journal.filter(x=>x.id!==id); saveState(); paint(); }};
  window.addJournal = ()=>{ state.journal.unshift({id:'j'+Date.now(),title:'New Prompt',body:'',ts:Date.now()}); saveState(); paint(); };
  paint();

function exportJournal(){
  const blob = new Blob([JSON.stringify(state.journal,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='prompt-journal.json'; a.click();
  URL.revokeObjectURL(url);
  toast('Journal exported!');
}
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function shareLinkedIn(){

async function downloadCertificate(){
  toast('Preparing your certificate PDF…');
  const node = document.getElementById('certificate-print');
  const canvas = await html2canvas(node, {scale:2, useCORS:true, backgroundColor:'#fffdf7'});
  const img = canvas.toDataURL('image/png');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
  const pw = pdf.internal.pageSize.getWidth();
  const ph = pdf.internal.pageSize.getHeight();
  const ratio = canvas.width / canvas.height;
  let w = pw - 10, h = w / ratio;
  if (h > ph - 10) { h = ph - 10; w = h * ratio; }
  pdf.addImage(img, 'PNG', (pw-w)/2, (ph-h)/2, w, h);
  pdf.save(`PromptMastery-Certificate-${state.name.replace(/\s+/g,'_')}.pdf`);
  toast('Downloaded! 🎓');
}

function confetti(){
  const colors = ['#4F46E5','#D4A574','#10B981','#F59E0B','#EF4444','#818CF8'];
  for (let i=0;i<140;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100+'vw';
    p.style.top = '-20px';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(p);
    const dur = 2200 + Math.random()*1800;
    p.animate([
      {transform:`translateY(0) rotate(0)`, opacity:1},
      {transform:`translateY(110vh) rotate(${Math.random()*720}deg)`, opacity:0.9}
    ], { duration: dur, easing:'cubic-bezier(.2,.7,.4,1)' });
    setTimeout(()=>p.remove(), dur);
  }
}

function renderSearch(host) {
  host.innerHTML = `
    <input id="search-q" placeholder="Search sessions, topics, frameworks, tools..." class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 mb-4"/>
    <div id="search-res" class="space-y-2"></div>`;
  const sources = SESSIONS.map(s=>({ id:s.id, title:s.title, body: s.objectives.join(' • ') + ' · ' + s.title }));
  const inp = document.getElementById('search-q');
  inp.focus();
  inp.oninput = ()=>{
    const q = inp.value.toLowerCase();
    const res = document.getElementById('search-res');
    if (!q) { res.innerHTML = `<div class="text-sm text-slate-500">Try "CO-STAR", "Midjourney", "few-shot"...</div>`; return; }
    const hits = sources.filter(s=> s.title.toLowerCase().includes(q) || s.body.toLowerCase().includes(q));
    const tools = TOOLS.filter(t=> t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q));
    res.innerHTML = `
      ${hits.map(h=>`<a href="#/session/${h.id}" class="block p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-brand-400 bg-white dark:bg-slate-900"><div class="text-xs text-brand-600 font-bold">SESSION ${h.id}</div><div class="font-medium">${h.title}</div><div class="text-xs text-slate-500">${h.body}</div></a>`).join('')}
      ${tools.map(t=>`<a href="${t.url}" target="_blank" class="block p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-brand-400 bg-white dark:bg-slate-900"><div class="text-xs text-gold-600 font-bold">TOOL</div><div class="font-medium">${t.emoji} ${t.name}</div><div class="text-xs text-slate-500">${t.desc}</div></a>`).join('')}
      ${(hits.length+tools.length)===0?`<div class="text-sm text-slate-500">No matches. Try another keyword.</div>`:''}`;
  };
  inp.dispatchEvent(new Event('input'));
}

function openSettings(){

  document.getElementById('settings-modal').classList.remove('hidden');
  document.getElementById('settings-modal').classList.add('flex');
}
function closeSettings(){
  document.getElementById('settings-modal').classList.add('hidden');
  document.getElementById('settings-modal').classList.remove('flex');
}
function saveSettings(){
  const n = document.getElementById('settings-name').value.trim();
  if (n) state.name = n;
  saveState();
  closeSettings();
  router();
  toast('Saved!');
}
function toggleDark(){
  state.dark = !state.dark;
  document.documentElement.classList.toggle('dark', state.dark);
  const lab = document.getElementById('settings-dark');
  if (lab) lab.textContent = state.dark ? '🌙 On' : '☀️ Off';
  saveState();
}
function resetProgress(){
  if (!confirm('Reset all progress, journal, and final project? This cannot be undone.')) return;
  localStorage.removeItem(LS_KEY);
  state = {...defaultState};
  saveState();
  closeSettings();
  location.hash = '#/welcome';

}
function exportProgress(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);

  toast('Progress exported!');
}

/* ---------------- TOAST ---------------- */
let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toast-text').textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.add('hidden'), 2400);
  lucide.createIcons();
}
