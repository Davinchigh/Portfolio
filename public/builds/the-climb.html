<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Climb, a personal training plan (preview build)</title>
<link rel="stylesheet" href="vendor/fonts-climb.css">
<script>try{var t=localStorage.getItem("bfb-climb-theme")||localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
  :root{
    --bg:#F7F6F1; --card:#FFFFFF; --card-2:#FBFAF6; --ink:#1B1F1A; --ink-soft:#626860; --line:#E4E1D6;
    --accent:#3F5A3A; --accent-2:#6E8F5E; --accent-soft:#DFE7DA; --gold:#A97A26; --gold-soft:#F3E6CB;
    --ring-a:#3F5A3A; --ring-b:#C08A2E; --ring-c:#8A6FB0; --danger:#A24A3D; --radius:18px;
    --shadow:0 1px 2px rgba(27,31,26,.05), 0 14px 34px -22px rgba(27,31,26,.35);
  }
  [data-theme="dark"]{
    --bg:#10120D; --card:#191C15; --card-2:#1E221A; --ink:#F1F0E6; --ink-soft:#A3A595; --line:#2B2F24;
    --accent:#9BC08A; --accent-2:#7FA36E; --accent-soft:#25301F; --gold:#E0B25A; --gold-soft:#342B16;
    --ring-a:#9BC08A; --ring-b:#E0B25A; --ring-c:#B69BDB; --danger:#E08C7D;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 18px 40px -24px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .wrap{max-width:860px;margin:0 auto;padding:0 18px 90px}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.01em;margin:0}
  .muted{color:var(--ink-soft)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .btn{border:0;border-radius:999px;padding:12px 20px;font-weight:600;background:var(--accent);color:var(--bg);transition:transform .15s,filter .2s}
  .btn:hover{filter:brightness(1.07)} .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.small{padding:8px 14px;font-size:13px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-size:14px;transition:border-color .2s,background .2s}
  .chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:640px){.grid2{grid-template-columns:1fr}}

  /* Top bar: always visible, with this week's progress */
  .top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .top-in{max-width:860px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
  .brand{font-family:'Fraunces',serif;font-weight:600;font-size:20px;flex:1}
  .tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
  .tabs button{border:0;background:transparent;border-radius:999px;padding:7px 12px;font-size:13px;color:var(--ink-soft)}
  .tabs button[aria-current="page"]{background:var(--accent);color:var(--bg);font-weight:600}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
  .weekbar{height:3px;background:var(--line)} .weekbar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .6s ease}
  @media (max-width:640px){.tabs button{padding:7px 9px;font-size:12px}.brand{font-size:17px}}

  /* Onboarding */
  .ob{max-width:640px;margin:40px auto 0}
  .ob h1{font-size:clamp(30px,6vw,44px);line-height:1.05;margin:8px 0 10px}
  .ob-step{margin-top:26px}
  .ob-step h3{font-size:19px;margin-bottom:12px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .ob-progress{height:4px;border-radius:4px;background:var(--line);margin-top:22px;overflow:hidden} .ob-progress span{display:block;height:100%;background:var(--accent);transition:width .4s}

  /* Today */
  .hello{margin:28px 0 18px}
  .hello h1{font-size:clamp(28px,5vw,38px);line-height:1.08;margin-top:6px}
  .rings{display:flex;gap:18px;align-items:center}
  .ring-legend{display:grid;gap:8px;font-size:13px}
  .ring-legend b{font-family:'IBM Plex Mono',monospace;font-size:13px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
  .week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
  .day{border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;background:var(--card-2)}
  .day b{display:block;font-size:15px;margin-top:2px}
  .day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .day.done{background:var(--accent-soft)} .day.rest{opacity:.6}
  .ready-row{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:10px;margin:10px 0}
  .ready-row input{width:100%;accent-color:var(--accent)}
  .verdict{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--card-2);border:1px solid var(--line);font-size:14px}
  .workout h2{font-size:24px;margin:4px 0}
  .ex-list{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
  .ex-list li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--card-2);border:1px solid var(--line);font-size:14px}
  .ex-list .amt{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
  .pose{width:34px;height:34px;flex:none;color:var(--accent)}
  .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .badge{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-size:12.5px;background:var(--card-2)}
  .badge .medal{font-size:24px;filter:grayscale(1);opacity:.35}
  .badge.got{border-color:var(--gold);background:var(--gold-soft)} .badge.got .medal{filter:none;opacity:1}
  .heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
  .heat i{aspect-ratio:1;border-radius:4px;background:var(--line)}
  .heat i.l1{background:color-mix(in srgb,var(--accent) 45%,var(--line))} .heat i.l2{background:var(--accent)}
  .section{margin-top:26px} .section-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .section-h h2{font-size:20px}
  .note{font-size:12.5px;line-height:1.6;color:var(--ink-soft);margin-top:30px;padding:14px;border-radius:12px;border:1px dashed var(--line)}
  .lib-filters{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
  .lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .lib .card{padding:14px;box-shadow:none}
  .chart{width:100%;height:auto}
  .log{display:flex;gap:8px;margin-bottom:12px} .log input{flex:1;padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card-2);color:var(--ink);font:inherit}

  /* Player */
  .player{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
  .player.open{display:flex}
  .player-top{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .player-bar{height:4px;background:var(--line)} .player-bar span{display:block;height:100%;background:var(--accent);transition:width .4s}
  .player-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
  .player-main .pose{width:120px;height:120px}
  .player-name{font-family:'Fraunces',serif;font-size:clamp(28px,6vw,46px);font-weight:600}
  .big{font-family:'IBM Plex Mono',monospace;font-size:clamp(64px,16vw,120px);line-height:1;font-weight:500;font-variant-numeric:tabular-nums}
  .phase{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  .cue{max-width:46ch;color:var(--ink-soft);line-height:1.55}
  .player-ctrl{display:flex;gap:10px;justify-content:center;padding:18px;border-top:1px solid var(--line)}
  .feel{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="player" id="player" role="dialog" aria-modal="true" aria-label="Workout"></div>
<script>
(function(){
/* ======================= DATA ======================= */
const KEY = "bfb-climb-v2", OLD_KEY = "bfb-climb-preview-v1", THEME_KEY = "bfb-climb-theme";
const NAME = (() => {
  const clean = (v) => (v || "").replace(/[^\p{L}\p{M} .-]/gu, "").replace(/\s+/g, " ").trim().slice(0, 30);
  try {
    const fromLink = clean(new URLSearchParams(location.hash.slice(1)).get("name"));
    if (fromLink) { localStorage.setItem("bfb_visitor_name", fromLink); return fromLink; }
    return clean(localStorage.getItem("bfb_visitor_name"));
  } catch (e) { return ""; }
})();

// Simple line drawings for each movement pattern (illustrative, not anatomical).
const POSES = {
  squat: '<circle cx="24" cy="8" r="4"/><path d="M24 12v12l-8 6v10M24 24l8 6v10M16 18h16"/>',
  hinge: '<circle cx="14" cy="12" r="4"/><path d="M17 15l14 6v18M31 21l4 18M17 15l-1 12"/>',
  push: '<circle cx="9" cy="20" r="4"/><path d="M13 22l26 6M18 23v10M39 28l3 10M13 22l-2 12"/>',
  pull: '<circle cx="24" cy="12" r="4"/><path d="M24 16v14l-6 10M24 30l6 10M24 20l-10-12M24 20l10-12M10 6h28"/>',
  core: '<circle cx="9" cy="26" r="4"/><path d="M13 28h26M17 28v8M39 28v8"/>',
  cardio: '<circle cx="26" cy="7" r="4"/><path d="M26 11l-4 12 8 6-4 12M22 23l-8 4M26 15l10 4M30 29l8 2"/>',
  mobility: '<circle cx="24" cy="8" r="4"/><path d="M24 12v16M24 18l-14-6M24 18l14-6M24 28l-8 12M24 28l8 12"/>',
  lunge: '<circle cx="22" cy="7" r="4"/><path d="M22 11v14M22 25l-10 4v10M22 25l10 2 2 12M14 17h16"/>',
};
const pose = (p, cls = "pose") => `<svg class="${cls}" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${POSES[p] || POSES.core}</svg>`;

// Exercise library. kind: reps or time. eq: equipment needed. lvl: 1 easier, 3 harder. low: low impact.
const EX = [
  ["march","Marching in place","cardio","time",[],1,1,"Lift knees to hip height, swing your arms, breathe steadily."],
  ["jacks","Jumping jacks","cardio","time",[],1,0,"Land softly on the balls of your feet. Step side to side instead if you need low impact."],
  ["stepjacks","Step jacks","cardio","time",[],1,1,"Step one foot out while raising your arms, then switch. All the rhythm, none of the jumping."],
  ["climbers","Mountain climbers","cardio","time",[],2,0,"Hips level with shoulders, drive knees in with control rather than speed."],
  ["burpee","Burpees","cardio","reps",[],3,0,"Step back instead of jumping if you need to. Control the way down."],
  ["skaters","Skater steps","cardio","time",[],2,1,"Step wide side to side, sweep the back leg behind, land soft."],
  ["squat","Bodyweight squat","squat","reps",[],1,1,"Sit back as if into a chair, knees tracking over toes, chest up."],
  ["gobsquat","Goblet squat","squat","reps",["dumbbells"],2,1,"Hold the dumbbell at your chest, elbows inside the knees at the bottom."],
  ["jumpsquat","Squat jump","squat","reps",[],3,0,"Land quietly with soft knees, then sink straight into the next squat."],
  ["lunge","Reverse lunge","lunge","reps",[],1,1,"Step back, lower until both knees bend to about 90°, front knee over ankle."],
  ["dblunge","Dumbbell split squat","lunge","reps",["dumbbells"],2,1,"Stay tall, lower straight down, drive through the front heel."],
  ["bridge","Glute bridge","hinge","reps",[],1,1,"Drive through your heels, squeeze glutes at the top, don't overarch."],
  ["rdl","Dumbbell Romanian deadlift","hinge","reps",["dumbbells"],2,1,"Soft knees, push hips back, keep the weights close to your legs."],
  ["bandpull","Band pull-apart","pull","reps",["band"],1,1,"Arms straight, squeeze shoulder blades together, control the return."],
  ["dbrow","Dumbbell row","pull","reps",["dumbbells"],2,1,"Flat back, pull the elbow to your hip, pause, lower slowly."],
  ["bandrow","Band row","pull","reps",["band"],1,1,"Anchor the band, pull to your ribs, squeeze, return slowly."],
  ["superman","Superman hold","pull","time",[],1,1,"Lift arms and legs a little, neck long, squeeze your back and glutes."],
  ["inclinepush","Incline push-up","push","reps",[],1,1,"Hands on a table or wall, body in one straight line."],
  ["pushup","Push-up","push","reps",[],2,1,"Hands under shoulders, elbows at 45°, lower your chest to a fist's height."],
  ["dbpress","Dumbbell shoulder press","push","reps",["dumbbells"],2,1,"Ribs down, press straight up, lower to ear height."],
  ["plank","Plank","core","time",[],1,1,"Elbows under shoulders, squeeze glutes, breathe."],
  ["deadbug","Dead bug","core","reps",[],1,1,"Lower back stays pressed down as you extend opposite arm and leg."],
  ["sideplank","Side plank","core","time",[],2,1,"Stack your feet or drop the bottom knee. Hips up, body straight."],
  ["birddog","Bird dog","core","reps",[],1,1,"Reach long through opposite hand and foot, keep the hips square."],
  ["catcow","Cat to cow","mobility","time",[],1,1,"Move slowly with your breath through the whole spine."],
  ["worldsgreatest","World's greatest stretch","mobility","time",[],1,1,"Lunge, hand down, rotate the other arm to the sky. Swap sides halfway."],
  ["hipflexor","Kneeling hip flexor stretch","mobility","time",[],1,1,"Tuck the pelvis under and squeeze the back glute. Swap sides halfway."],
  ["childpose","Child's pose","mobility","time",[],1,1,"Sink the hips back, arms long, slow breaths."],
].map(([id,name,pattern,kind,eq,lvl,low,cue]) => ({id,name,pattern,kind,eq,lvl,low:!!low,cue}));
const byId = Object.fromEntries(EX.map(e => [e.id, e]));

const GOALS = { strength:"Get stronger", fat:"Lose fat", fitness:"Build fitness", move:"Move better" };
const LEVELS = { 1:"New to training", 2:"Some experience", 3:"Train regularly" };
const BADGES = [
  ["first","First workout","Finish your first session","🥾"],
  ["three","Three in a week","Hit three workouts in one week","🔥"],
  ["streak7","Seven-day streak","Train or recover seven days running","⛰️"],
  ["week","Basecamp","Complete a full week of your plan","🏕️"],
  ["ten","Ten sessions","Ten workouts done","🎯"],
  ["honest","Honest feedback","Rate how five workouts felt","🧭"],
  ["summit","Summit","Finish all four weeks","🏔️"],
];
const QUOTES = ["Small and consistent beats big and occasional.","You don't need to feel ready. Start, and readiness follows.","Rest days count. Recovery is where strength is built.","Nobody regrets a workout once it's done.","Today just needs today's session. Nothing more."];

/* ======================= STATE ======================= */
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = (d) => addDays(d, -((d.getDay()+6)%7));

let state = load();
function load(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e){}
  if (!s) {
    s = { profile:null, start:null, intensity:1, history:[], readiness:{}, weights:[], voice:true, feelings:0 };
    // Keep weight entries from the earlier version of the app.
    try { const old = JSON.parse(localStorage.getItem(OLD_KEY) || "null"); if (old && Array.isArray(old.weights)) s.weights = old.weights; } catch(e){}
  }
  return s;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

/* ======================= PLAN ======================= */
// Which movement patterns each session trains, by days per week.
const SPLITS = {
  2: [["squat","push","hinge","pull","core"],["lunge","pull","hinge","push","core","cardio"]],
  3: [["squat","push","pull","core"],["hinge","lunge","pull","core"],["cardio","squat","push","cardio","core"]],
  4: [["squat","push","core"],["hinge","pull","core"],["cardio","lunge","cardio","core"],["squat","pull","push","hinge"]],
  5: [["squat","push","core"],["hinge","pull","core"],["cardio","lunge","cardio","core"],["mobility","core","mobility"],["squat","pull","push","hinge"]],
};
const DAYS_FOR = { 2:[0,3], 3:[0,2,4], 4:[0,1,3,5], 5:[0,1,2,4,5] };

function pick(pattern, p, seed){
  const ok = EX.filter(e => e.pattern === pattern && e.lvl <= p.level + (pattern === "mobility" ? 0 : 0) && e.eq.every(q => p.equipment.includes(q)) && (!p.lowImpact || e.low));
  if (!ok.length) return EX.find(e => e.pattern === pattern) || EX[0];
  // Prefer the hardest suitable option, rotating through a few for variety.
  const sorted = ok.sort((a,b) => b.lvl - a.lvl);
  return sorted[seed % Math.min(sorted.length, 2)];
}

/** Builds one session for a given week (0-3) and day of the plan, scaled by goal, level, time, intensity and readiness. */
function buildSession(weekIdx, slot, readiness){
  const p = state.profile;
  const patterns = SPLITS[p.days][slot % SPLITS[p.days].length];
  const style = { strength:{kind:"reps", work:40, rest:45, reps:10}, fat:{kind:"time", work:40, rest:20, reps:12}, fitness:{kind:"time", work:35, rest:25, reps:12}, move:{kind:"time", work:45, rest:15, reps:8} }[p.goal];
  const mode = readiness || "full";
  if (mode === "recovery") {
    return { title:"Recovery flow", mode, warm:[], rounds:1, rest:10, items:["catcow","worldsgreatest","hipflexor","birddog","childpose"].map(id => ({ ex:byId[id], amount:45, unit:"s" })) };
  }
  const roundsBase = p.minutes <= 15 ? 2 : p.minutes <= 25 ? 3 : 4;
  let rounds = Math.min(roundsBase + (weekIdx >= 2 ? 1 : 0), 5);
  const scale = state.intensity * (1 + weekIdx * 0.08) * (mode === "lighter" ? 0.8 : 1) * (p.level === 1 ? 0.85 : p.level === 3 ? 1.15 : 1);
  if (mode === "lighter") rounds = Math.max(1, rounds - 1);
  const items = patterns.map((pat, i) => {
    const ex = p.goal === "move" && pat !== "core" && i % 2 ? pick("mobility", p, slot + i) : pick(pat, p, slot + weekIdx + i);
    if (ex.kind === "reps") return { ex, amount: Math.max(5, Math.round(style.reps * scale)), unit:"reps" };
    return { ex, amount: Math.max(20, Math.round((style.work * scale) / 5) * 5), unit:"s" };
  });
  const warm = ["march","catcow","worldsgreatest"].map(id => ({ ex:byId[id], amount:40, unit:"s" }));
  const names = { strength:"Strength", fat:"Burn", fitness:"Engine", move:"Mobility & core" };
  return { title:`${names[p.goal]} · ${patterns.map(x => x[0].toUpperCase()+x.slice(1)).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3).join(", ")}`, mode, warm, rounds, rest: style.rest, items };
}

function planWeek(){ const s = new Date(state.start); return Math.max(0, Math.floor((today() - mondayOf(s)) / 864e5 / 7)); }
function slotForDate(d){ const days = DAYS_FOR[state.profile.days]; return days.indexOf((d.getDay()+6)%7); }
function minutesOf(sess){ const per = sess.items.reduce((n,it) => n + (it.unit === "s" ? it.amount : it.amount*3) + sess.rest, 0); return Math.round((sess.warm.length*40 + per*sess.rounds)/60); }

/* ======================= STATS ======================= */
const doneOn = (d) => state.history.some(h => h.date === iso(d));
function weekStats(){
  const mon = mondayOf(today());
  const days = [...Array(7)].map((_,i) => addDays(mon, i));
  const sessions = state.history.filter(h => h.date >= iso(mon) && h.date <= iso(addDays(mon,6)));
  const minutes = sessions.reduce((n,h) => n + (h.minutes||0), 0);
  return { days, sessions:sessions.length, minutes, target: state.profile.days, minTarget: state.profile.days * state.profile.minutes };
}
function streak(){ let n = 0, d = today(); if (!doneOn(d) && !state.readiness[iso(d)]) d = addDays(d,-1); while (doneOn(d) || (state.readiness[iso(d)] && state.readiness[iso(d)].rested)) { n++; d = addDays(d,-1); } return n; }
function earned(){
  const got = new Set(); const h = state.history;
  if (h.length) got.add("first"); if (h.length >= 10) got.add("ten"); if ((state.feelings||0) >= 5) got.add("honest");
  if (streak() >= 7) got.add("streak7");
  const byWeek = {}; h.forEach(x => { const k = iso(mondayOf(new Date(x.date+"T00:00"))); byWeek[k] = (byWeek[k]||0)+1; });
  if (Object.values(byWeek).some(n => n >= 3)) got.add("three");
  if (Object.values(byWeek).some(n => n >= state.profile.days)) got.add("week");
  if (Object.keys(byWeek).filter(k => byWeek[k] >= state.profile.days).length >= 4) got.add("summit");
  return got;
}

/* ======================= VIEW ======================= */
let view = "today";
const app = document.getElementById("app");
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function ring(r, pct, color, w = 10){
  const c = 2*Math.PI*r, off = c*(1-Math.min(1,pct));
  return `<circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--line)" stroke-width="${w}"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 60 60)" style="transition:stroke-dashoffset .8s ease"/>`;
}

function topBar(){
  const ws = state.profile ? weekStats() : null;
  return `<div class="top"><div class="top-in">
    <div class="brand">The Climb</div>
    ${state.profile ? `<nav class="tabs" aria-label="Sections">${[["today","Today"],["plan","Plan"],["progress","Progress"],["library","Moves"]].map(([k,l]) => `<button data-view="${k}" ${view===k?'aria-current="page"':''}>${l}</button>`).join("")}</nav>` : ""}
    <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark mode">${document.documentElement.dataset.theme === "dark" ? "☀" : "☾"}</button>
  </div>${ws ? `<div class="weekbar" role="progressbar" aria-label="This week's workouts" aria-valuemin="0" aria-valuemax="${ws.target}" aria-valuenow="${ws.sessions}"><span style="width:${Math.min(100, ws.sessions/ws.target*100)}%"></span></div>` : ""}</div>`;
}

let ob = { step:0, goal:null, level:null, days:null, minutes:null, equipment:[], lowImpact:false };
function renderOnboarding(){
  const steps = [
    ["What are you climbing toward?", "goal", Object.entries(GOALS)],
    ["Where are you starting from?", "level", Object.entries(LEVELS)],
    ["How many days a week can you train?", "days", [[2,"2 days"],[3,"3 days"],[4,"4 days"],[5,"5 days"]]],
    ["How long per session?", "minutes", [[15,"15 minutes"],[25,"25 minutes"],[40,"40 minutes"]]],
    ["What do you have at home?", "equipment", [["dumbbells","Dumbbells"],["band","Resistance band"]]],
  ];
  const [q, key, opts] = steps[Math.min(ob.step, steps.length-1)];
  const multi = key === "equipment";
  app.innerHTML = topBar() + `<div class="wrap"><div class="ob">
    <p class="eyebrow">Your plan, built in a minute${NAME ? ` · for ${esc(NAME)}` : ""}</p>
    <h1>Let's build a plan that fits your life.</h1>
    <p class="muted">Five quick questions. Your answers stay on this device and shape every workout: the moves, the volume and how it progresses over four weeks.</p>
    <div class="ob-progress" aria-hidden="true"><span style="width:${(ob.step/steps.length)*100}%"></span></div>
    <div class="ob-step"><h3>${q}</h3><div class="chips" role="group" aria-label="${esc(q)}">
      ${opts.map(([v,l]) => { const on = multi ? ob.equipment.includes(v) : String(ob[key]) === String(v); return `<button class="chip" data-k="${key}" data-v="${v}" aria-pressed="${on}">${l}</button>`; }).join("")}
      ${multi ? `<button class="chip" data-k="equipment" data-v="none" aria-pressed="${!ob.equipment.length}">Nothing, bodyweight only</button>` : ""}
    </div>
    ${multi ? `<label style="display:flex;gap:10px;align-items:center;margin-top:16px;font-size:14px"><input type="checkbox" id="lowImpact" ${ob.lowImpact?"checked":""}> Keep it low impact (no jumping), kinder to knees and neighbours</label>
      <div style="margin-top:22px"><button class="btn" id="buildPlan">Build my plan</button></div>` : ""}
    </div>
    ${ob.step ? `<button class="btn ghost small" id="obBack" style="margin-top:18px">← Back</button>` : ""}
    <p class="note">This app suggests general exercise for healthy adults. It is not medical advice. If you have an injury, a health condition, are pregnant or are new to exercise after a long break, check with a doctor first, and stop any move that causes pain.</p>
  </div></div>`;
  app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
    const k = b.dataset.k, v = b.dataset.v;
    if (k === "equipment") { if (v === "none") ob.equipment = []; else ob.equipment = ob.equipment.includes(v) ? ob.equipment.filter(x => x !== v) : [...ob.equipment, v]; return renderOnboarding(); }
    ob[k] = isNaN(+v) ? v : +v; ob.step++; renderOnboarding();
  });
  const back = document.getElementById("obBack"); if (back) back.onclick = () => { ob.step--; renderOnboarding(); };
  const lo = document.getElementById("lowImpact"); if (lo) lo.onchange = () => { ob.lowImpact = lo.checked; };
  const go = document.getElementById("buildPlan"); if (go) go.onclick = () => {
    state.profile = { goal:ob.goal, level:ob.level, days:ob.days, minutes:ob.minutes, equipment:ob.equipment, lowImpact:ob.lowImpact };
    state.start = iso(today()); state.intensity = 1; save(); view = "today"; render(); window.scrollTo(0,0);
  };
  bindTop();
}

function readinessCard(){
  const r = state.readiness[iso(today())];
  const v = r || { sleep:3, sore:3, energy:3 };
  return `<div class="card"><div class="section-h"><h2>How are you today?</h2><span class="muted" style="font-size:12px">sets today's session</span></div>
    ${[["sleep","Sleep","poor","great"],["energy","Energy","flat","buzzing"],["sore","Soreness","none","very"]].map(([k,l,a,b]) => `<div class="ready-row"><label for="r-${k}">${l} <span class="muted" style="font-size:11px">(${a} → ${b})</span></label><input type="range" min="1" max="5" step="1" id="r-${k}" value="${v[k]}"><b id="rv-${k}">${v[k]}</b></div>`).join("")}
    <button class="btn small" id="saveReady">${r ? "Update" : "Check in"}</button>
    ${r ? `<div class="verdict"><b>${r.mode === "full" ? "Green light: full session." : r.mode === "lighter" ? "Lighter today: one round less, shorter sets." : "Recovery day: a gentle mobility flow."}</b> <span class="muted">${r.mode === "recovery" ? "Low sleep, low energy or high soreness: recovering well is training too." : r.mode === "lighter" ? "You're a bit run down. Showing up lighter still counts." : "You're well rested. Go get it."}</span></div>` : ""}
  </div>`;
}

function todaySession(){
  const slot = slotForDate(today());
  const r = state.readiness[iso(today())];
  if (slot < 0) return null;
  return buildSession(Math.min(planWeek(), 3), slot, r ? r.mode : "full");
}

function sessionList(s){
  return `<ul class="ex-list">${(s.warm.length ? [`<li style="background:transparent;border-style:dashed">${pose("mobility")}<span>Warm-up: ${s.warm.map(w=>w.ex.name.toLowerCase()).join(", ")}</span><span class="amt">${s.warm.length*40}s</span></li>`] : []).concat(s.items.map(it => `<li>${pose(it.ex.pattern)}<span>${esc(it.ex.name)}</span><span class="amt">${it.amount}${it.unit === "s" ? "s" : " reps"}</span></li>`)).join("")}</ul>
    <p class="muted" style="font-size:13px;margin:12px 0 0">${s.rounds} round${s.rounds>1?"s":""} · ${s.rest}s rest between moves · about ${minutesOf(s)} min</p>`;
}

function chart(points){
  if (points.length < 2) return `<p class="muted">Log your weight on two different days to see the line.</p>`;
  const W = 640, H = 200, pad = 30, xs = points.map((_,i)=>i), ys = points.map(p=>p.kg);
  const min = Math.min(...ys) - 1, max = Math.max(...ys) + 1;
  const X = i => pad + i*(W-2*pad)/(points.length-1), Y = v => H - pad - (v-min)*(H-2*pad)/(max-min);
  const d = points.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(p.kg).toFixed(1)}`).join(" ");
  const change = (ys[ys.length-1]-ys[0]).toFixed(1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight from ${ys[0]} kg to ${ys[ys.length-1]} kg over ${points.length} entries"><path d="${d} L${X(points.length-1)} ${H-pad} L${pad} ${H-pad}Z" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${points.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.kg)}" r="3.5" fill="var(--accent)"/>`).join("")}<text x="${pad}" y="18" fill="var(--ink-soft)" font-size="12">${change > 0 ? "+" : ""}${change} kg since ${points[0].date}</text></svg>`;
}

  const cells = [...Array(weeks*7)].map((_,i) => { const d = addDays(start, Math.floor(i%weeks)*7 + Math.floor(i/weeks)); const n = state.history.filter(h=>h.date===iso(d)).length; return d > today() ? '<i style="opacity:.3"></i>' : `<i class="${n>1?"l2":n?"l1":""}" title="${iso(d)}"></i>`; }).join("");
  const total = state.history.length, mins = state.history.reduce((n,h)=>n+(h.minutes||0),0);
  const pts = state.weights.slice().sort((a,b)=>a.date.localeCompare(b.date));
  app.innerHTML = topBar() + `<div class="wrap"><div class="hello"><p class="eyebrow">Progress</p><h1>Every checkpoint counts.</h1></div>
    <div class="grid2"><div class="card"><p class="eyebrow">All time</p><h2 style="font-size:40px;margin-top:6px">${total}</h2><p class="muted">workouts · ${mins} minutes · best streak so far ${streak()} days</p></div>
      <div class="card"><p class="eyebrow">Last 12 weeks</p><div class="heat" style="margin-top:12px" role="img" aria-label="Training calendar for the last twelve weeks">${cells}</div><p class="muted" style="font-size:12px;margin-top:8px">Each square is a day; darker means you trained.</p></div></div>
    <div class="card section"><div class="section-h"><h2>Weight log</h2><span class="muted" style="font-size:12px">private · this device</span></div>
      <div class="log"><input type="number" step="0.1" min="20" max="400" id="kg" placeholder="Today's weight (kg)" aria-label="Today's weight in kilograms"><button class="btn small" id="logKg">Log</button></div>${chart(pts)}</div>
    <div class="card section"><div class="section-h"><h2>Recent workouts</h2></div>${state.history.length ? `<ul class="ex-list">${state.history.slice(-8).reverse().map(h=>`<li>${pose("cardio")}<span>${esc(h.title)}</span><span class="amt">${h.date} · ${h.minutes} min · felt ${h.felt||"–"}</span></li>`).join("")}</ul>` : `<p class="muted">Your finished workouts will show here.</p>`}</div>
  </div>`;
  bindTop();

}

let libFilter = "all";

  const pats = ["all","squat","lunge","hinge","push","pull","core","cardio","mobility"];
  const list = EX.filter(e => libFilter === "all" || e.pattern === libFilter);
  app.innerHTML = topBar() + `<div class="wrap"><div class="hello"><p class="eyebrow">Moves</p><h1>The exercise library</h1><p class="muted">Every move in your plan, with the one cue that matters most. Bodyweight, dumbbell and band options, and low-impact choices are marked.</p></div>
    <div class="lib-filters" role="group" aria-label="Filter by movement">${pats.map(p=>`<button class="chip" data-f="${p}" aria-pressed="${libFilter===p}">${p}</button>`).join("")}</div>

function bindTop(){
  app.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { view = b.dataset.view; render(); window.scrollTo(0,0); });
  const t = document.getElementById("themeBtn");
  if (t) t.onclick = () => { const d = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = d; try { localStorage.setItem(THEME_KEY, d); } catch(e){} render(); };
}

function render(){
  if (!state.profile) return renderOnboarding();
  ({ today:renderToday, plan:renderPlan, progress:renderProgress, library:renderLibrary })[view]();
}

/* ======================= PLAYER ======================= */
let audioCtx, wakeLock = null, timer = null;
function beep(freq, dur){ try { audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = freq; g.gain.setValueAtTime(0.15, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur/1000); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur/1000); } catch(e){} }
function say(text){ if (!state.voice || !("speechSynthesis" in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 1.02; speechSynthesis.speak(u); } catch(e){} }

function stepsOf(s){
  const steps = [];
  s.warm.forEach(w => steps.push({ type:"work", ex:w.ex, amount:w.amount, unit:"s", label:"Warm-up" }));
  for (let r = 0; r < s.rounds; r++) s.items.forEach((it, i) => {
    steps.push({ type:"work", ex:it.ex, amount:it.amount, unit:it.unit, label:`Round ${r+1} of ${s.rounds}` });
    if (!(r === s.rounds-1 && i === s.items.length-1)) steps.push({ type:"rest", amount:s.rest, unit:"s", label:"Rest" });
  });
  return steps;
}

function openPlayer(s){
  const el = document.getElementById("player"), steps = stepsOf(s);
  let i = 0, left = 0, paused = false, startedAt = Date.now();
  if ("wakeLock" in navigator) navigator.wakeLock.request("screen").then(l => wakeLock = l).catch(()=>{});
  el.classList.add("open"); document.body.style.overflow = "hidden";
  const nextWork = (from) => steps.slice(from).find(x => x.type === "work");
  function show(){
    const st = steps[i]; const nx = nextWork(i+1);
    el.innerHTML = `<div class="player-top"><button class="btn ghost small" id="pClose">✕ End</button><div style="flex:1" class="muted">${esc(s.title)}</div><span class="eyebrow">${i+1}/${steps.length}</span></div>
      <div class="player-bar"><span style="width:${(i/steps.length)*100}%"></span></div>
      <div class="player-main" aria-live="polite">
        <div class="phase">${st.label}</div>
        ${st.type === "work" ? pose(st.ex.pattern) : ""}
        <div class="player-name">${st.type === "work" ? esc(st.ex.name) : "Breathe"}</div>
        ${st.unit === "reps" ? `<div class="big">${st.amount}<span style="font-size:.3em"> reps</span></div><button class="btn" id="pDone">Done</button>` : `<div class="big" id="pTime">${left}</div>`}
        <p class="cue">${st.type === "work" ? esc(st.ex.cue) : nx ? `Next: ${esc(nx.ex.name)}${nx.unit==="reps" ? ` × ${nx.amount}` : ` for ${nx.amount}s`}` : "Last one done after this."}</p>
      </div>
      <div class="player-ctrl"><button class="btn ghost" id="pBack">← Back</button>${st.unit === "s" ? `<button class="btn" id="pPause">${paused ? "Resume" : "Pause"}</button>` : ""}<button class="btn ghost" id="pSkip">Skip →</button></div>`;
    document.getElementById("pClose").onclick = close;
    document.getElementById("pSkip").onclick = () => go(i+1);
    document.getElementById("pBack").onclick = () => go(Math.max(0,i-1));
    const done = document.getElementById("pDone"); if (done) done.onclick = () => go(i+1);
    const pause = document.getElementById("pPause"); if (pause) pause.onclick = () => { paused = !paused; show(); };
    (document.getElementById("pDone") || document.getElementById("pPause")).focus();
  }
  function go(n){
    clearInterval(timer);
    if (n >= steps.length) return finish();
    i = n; const st = steps[i]; left = st.amount; paused = false;
    say(st.type === "work" ? `${st.ex.name}. ${st.unit === "reps" ? st.amount + " reps" : st.amount + " seconds"}` : `Rest. ${nextWork(i+1) ? "Next, " + nextWork(i+1).ex.name : ""}`);
    show();
    if (st.unit === "s") timer = setInterval(() => {
      if (paused) return;
      left--; const t = document.getElementById("pTime"); if (t) t.textContent = left;
      if (left <= 3 && left > 0) beep(660, 120);
      if (left <= 0) { beep(990, 300); go(i+1); }
    }, 1000);
  }
  function finish(){
    clearInterval(timer);
    const minutes = Math.max(1, Math.round((Date.now() - startedAt) / 60000));
    el.innerHTML = `<div class="player-main"><div class="phase">Session complete</div><div class="player-name">Checkpoint reached.</div><p class="cue">${minutes} minute${minutes===1?"":"s"}. How did that feel? Your answer tunes the next workout.</p>
      <div class="feel">${[["easy","Too easy"],["right","About right"],["hard","Too hard"]].map(([k,l])=>`<button class="btn ${k==="right"?"":"ghost"}" data-feel="${k}">${l}</button>`).join("")}</div></div>`;
    say("Session complete. How did that feel?");
    el.querySelectorAll("[data-feel]").forEach(b => b.onclick = () => {
      const f = b.dataset.feel;
      state.intensity = Math.min(1.3, Math.max(0.7, state.intensity + (f === "easy" ? 0.08 : f === "hard" ? -0.08 : 0)));
      state.feelings = (state.feelings||0) + 1;
      state.history.push({ date: iso(today()), title: s.title, minutes, felt: f === "easy" ? "easy" : f === "hard" ? "hard" : "right" });
      save(); close();
    });
  }
  function close(){ clearInterval(timer); try { speechSynthesis.cancel(); } catch(e){} if (wakeLock) wakeLock.release().catch(()=>{}); el.classList.remove("open"); document.body.style.overflow = ""; render(); }
  el.onkeydown = (e) => { if (e.key === "Escape") close(); };
  go(0);
}

render();
})();
</script>
</body>
</html>
